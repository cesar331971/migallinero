<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mi Gallinero</title><style>body{font:16px Arial;margin:0;background:#fff7ed;color:#292524}main{max-width:760px;margin:auto;padding:20px}h1{color:#b42318}.cards{display:flex;gap:10px;flex-wrap:wrap}.card,section{background:#fff;border:1px solid #eadfd4;border-radius:12px;padding:15px;margin:12px 0}.card{flex:1;min-width:150px}.card b{display:block;font-size:23px;margin-top:6px}label,input,select{display:block;width:100%;box-sizing:border-box;margin:7px 0}input,select{padding:9px}button{padding:9px 11px;background:#b42318;color:#fff;border:0;border-radius:7px;font-weight:bold}.delete{background:#fff0ed;color:#b42318;margin-top:7px}.row{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid #eee;padding:10px 0}.small{color:#6b625c;font-size:13px}.bar{background:#b42318;color:#fff;margin:8px 0;border-radius:5px;padding:4px 8px;font-size:13px;min-width:70px}@media(max-width:500px){main{padding:12px}}</style></head><body><main><h1>🐔 Mi Gallinero</h1><p>Gastos e inventario</p><div class="cards"><div class="card">Gastos este mes<b id="mes">0,00 €</b></div><div class="card">Total de gastos<b id="total">0,00 €</b></div><div class="card">Número de gastos<b id="cantidad">0</b></div></div><section><h2>Añadir gasto</h2><form id="form"><label>Fecha<input id="fecha" type="date" required></label><label>Categoría<select id="categoria"><option>Alimentación</option><option>Medicinas y salud</option><option>Mantenimiento</option><option>Otros</option></select></label><label>Importe (€)<input id="importe" type="number" min="0.01" step="0.01" required></label><button>Guardar gasto</button></form></section><section><h2>Gastos por mes</h2><div id="meses"></div></section><section><h2>Historial de gastos</h2><div id="lista"></div></section></main><script>
const recuperados=[['2026-08-27','Alimentación',18.10],['2026-07-27','Alimentación',18.10],['2026-07-17','Alimentación',7.80],['2026-07-15','Alimentación',10],['2026-06-17','Alimentación',7.80],['2026-06-17','Alimentación',10],['2026-06-06','Alimentación',4.80],['2026-05-18','Alimentación',7.15],['2026-05-18','Alimentación',4.80],['2026-05-01','Alimentación',20]];let gastos;try{gastos=JSON.parse(localStorage.getItem('mis-gastos-gallinero'))}catch{}if(!Array.isArray(gastos)||!gastos.length)gastos=recuperados;const dinero=n=>n.toLocaleString('es-ES',{minimumFractionDigits:2,maximumFractionDigits:2})+' €';function guardar(){localStorage.setItem('mis-gastos-gallinero',JSON.stringify(gastos))}function pintar(){let hoy=new Date().toISOString().slice(0,7),total=gastos.reduce((s,x)=>s+x[2],0),este=gastos.filter(x=>x[0].startsWith(hoy)).reduce((s,x)=>s+x[2],0);document.getElementById('total').textContent=dinero(total);document.getElementById('mes').textContent=dinero(este);document.getElementById('cantidad').textContent=gastos.length;let l=document.getElementById('lista');l.innerHTML='';[...gastos].sort((a,b)=>b[0].localeCompare(a[0])).forEach((x,i)=>{let r=document.createElement('div');r.className='row';r.innerHTML='<span>'+x[0].split('-').reverse().join('/')+'<br><span class="small">'+x[1]+'</span></span><span><b>'+dinero(x[2])+'</b><br><button class="delete">Borrar</button></span>';r.querySelector('button').onclick=()=>{if(confirm('¿Quieres borrar este gasto?')){let pos=gastos.indexOf(x);gastos.splice(pos,1);guardar();pintar()}};l.append(r)});let g={};gastos.forEach(x=>{let k=x[0].slice(0,7);g[k]=(g[k]||0)+x[2]});let max=Math.max(...Object.values(g),1),m=document.getElementById('meses');m.innerHTML='';Object.entries(g).sort().forEach(([k,v])=>{let b=document.createElement('div');b.className='bar';b.style.width=(25+75*v/max)+'%';b.textContent=k+' · '+dinero(v);m.append(b)})}document.getElementById('fecha').value=new Date().toISOString().slice(0,10);document.getElementById('form').onsubmit=e=>{e.preventDefault();gastos.push([document.getElementById('fecha').value,document.getElementById('categoria').value,Number(document.getElementById('importe').value)]);guardar();pintar();e.target.reset();document.getElementById('fecha').value=new Date().toISOString().slice(0,10)};pintar();
</script><script>let manifest=document.createElement('link');manifest.rel='manifest';manifest.href='manifest.json';document.head.append(manifest);if('serviceWorker' in navigator)navigator.serviceWorker.register('service-worker.js');</script></body></html>
