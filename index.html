<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#b42318"><link rel="manifest" href="manifest.json"><title>Mi Gallinero</title><style>
*{box-sizing:border-box}body{margin:0;background:#fff8ee;color:#2d2926;font:16px Arial,sans-serif}main{max-width:860px;margin:auto;padding:18px}header{display:flex;justify-content:space-between;align-items:center;margin:8px 0 20px}h1{margin:0;color:#b42318}h2{font-size:19px}.sub{color:#756b64;margin:5px 0}.box{background:#fff;border:1px solid #eadfd4;border-radius:13px;padding:18px;margin:16px 0}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.summary div{background:#fff;border:1px solid #eadfd4;border-radius:12px;padding:14px}.summary span{color:#756b64;font-size:13px}.summary b{display:block;font-size:23px;margin-top:6px}label{display:block;font-weight:bold;margin:10px 0}input,select{display:block;width:100%;padding:10px;border:1px solid #cfc4b9;border-radius:8px;margin-top:5px;font:inherit}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}button{border:0;border-radius:8px;padding:11px 14px;font:inherit;font-weight:bold;cursor:pointer;background:#b42318;color:white}.light{background:#fff1ee;color:#b42318;margin-left:6px}.details{background:#fff4e7;border-radius:9px;padding:4px 12px;margin:8px 0}.details[hidden]{display:none}ul{list-style:none;padding:0;margin:0}.item{display:flex;justify-content:space-between;gap:10px;padding:13px 0;border-bottom:1px solid #eadfd4}.item:last-child{border:0}.small{font-size:13px;color:#756b64;margin:4px 0}.delete{background:transparent;color:#b42318;text-decoration:underline;padding:3px;font-size:13px}.chart{min-height:70px}.bar{height:20px;background:#b42318;color:white;margin:8px 0;border-radius:5px;padding:2px 7px;font-size:12px;min-width:65px}@media(max-width:560px){main{padding:12px}.summary{grid-template-columns:1fr 1fr}.summary div:last-child{grid-column:span 2}.grid{grid-template-columns:1fr}header{align-items:flex-start}}
</style></head><body><main><header><div><h1>🐔 Mi Gallinero</h1><p class="sub">Gastos e inventario</p></div></header><section class="summary"><div><span>Este mes</span><b id="month">0,00 €</b></div><div><span>Acumulado</span><b id="total">0,00 €</b></div><div><span>Pienso comprado</span><b id="feed">0 kg</b></div></section><section class="box"><h2>Registrar un gasto</h2><form id="form"><div class="grid"><label>Fecha<input id="date" type="date" required></label><label>Importe (€)<input id="amount" type="number" min="0.01" step="0.01" required></label></div><label>Categoría<select id="cat"><option>Alimentación</option><option>Medicinas y salud</option><option>Mantenimiento</option><option>Otros</option></select></label><div id="food" class="details"><div class="grid"><label>Tipo de pienso<input id="type"></label><label>Peso (kg)<input id="weight" type="number" min="0" step="0.1"></label></div></div><label>Notas<input id="notes"></label><button>Guardar gasto</button></form></section><section class="box"><h2>Gastos por mes</h2><div id="chart" class="chart"></div></section><section class="box"><h2>Historial</h2><button id="import" class="light">Importar copia</button><button id="export" class="light">Exportar CSV</button><input id="file" type="file" accept=".json,application/json" hidden><ul id="list"></ul></section></main><script>
const $=x=>document.getElementById(x),K='gallinero.gastos.v2',E=new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR'});let a=[];try{a=JSON.parse(localStorage.getItem(K)||'[]')}catch{}$('date').value=new Date().toISOString().slice(0,10);const save=()=>localStorage.setItem(K,JSON.stringify(a));$('cat').onchange=()=>$('food').hidden=$('cat').value!=='Alimentación';function draw(){let t=a.reduce((s,x)=>s+Number(x.amount),0),m=new Date().toISOString().slice(0,7),mt=a.filter(x=>x.date.startsWith(m)).reduce((s,x)=>s+Number(x.amount),0),f=a.filter(x=>x.category==='Alimentación').reduce((s,x)=>s+Number(x.weight||0),0);$('total').textContent=E.format(t);$('month').textContent=E.format(mt);$('feed').textContent=f+' kg';let l=$('list');l.replaceChildren();if(!a.length)l.textContent='Aún no hay gastos.';[...a].sort((x,y)=>y.date.localeCompare(x.date)).forEach(x=>{let li=document.createElement('li');li.className='item';let d=document.createElement('div'),b=document.createElement('b');b.textContent=x.category;let p=document.createElement('p');p.className='small';p.textContent=x.date+' · '+[x.feedType,x.weight?x.weight+' kg':'',x.notes].filter(Boolean).join(' · ');d.append(b,p);let r=document.createElement('div');r.innerHTML='<b>'+E.format(x.amount)+'</b>';let q=document.createElement('button');q.className='delete';q.textContent='Borrar';q.onclick=()=>{if(confirm('¿Borrar gasto?')){a=a.filter(y=>y.id!==x.id);save();draw()}};r.append(q);li.append(d,r);l.append(li)});let g={};a.forEach(x=>{let k=x.date.slice(0,7);g[k]=(g[k]||0)+Number(x.amount)});let c=$('chart');c.replaceChildren();let e=Object.entries(g).sort().slice(-12),max=Math.max(...e.map(x=>x[1]),1);if(!e.length)c.textContent='Registra gastos para ver la evolución.';e.forEach(([k,v])=>{let b=document.createElement('div');b.className='bar';b.style.width=(15+85*v/max)+'%';b.textContent=k+' · '+E.format(v);c.append(b)})}$('form').onsubmit=e=>{e.preventDefault();a.push({id:Date.now(),date:$('date').value,amount:Number($('amount').value),category:$('cat').value,feedType:$('type').value,weight:Number($('weight').value)||0,notes:$('notes').value});save();e.target.reset();$('date').value=new Date().toISOString().slice(0,10);$('food').hidden=false;draw()};$('import').onclick=()=>$('file').click();$('file').onchange=async e=>{try{let x=JSON.parse(await e.target.files[0].text());let n=x.map(z=>({id:z.id||Date.now()+Math.random(),date:z.fecha||z.date,amount:Number(z.importe??z.amount),category:z.categoria||z.category||'Otros',feedType:z.tipoPienso||z.feedType||'',weight:Number(z.peso??z.weight)||0,notes:z.notas||z.notes||''})).filter(z=>z.date&&z.amount>0);if(!n.length)throw 0;if(confirm('Importar '+n.length+' gastos?')){a.push(...n);save();draw();alert('Gastos importados')}}catch{alert('Elige el archivo copia-gallinero.json')}e.target.value=''};$('export').onclick=()=>{let s='Fecha;Categoría;Importe\n'+a.map(x=>x.date+';'+x.category+';'+x.amount).join('\n'),q=document.createElement('a');q.href=URL.createObjectURL(new Blob([s],{type:'text/csv'}));q.download='gastos-gallinero.csv';q.click()};if('serviceWorker'in navigator)navigator.serviceWorker.register('service-worker.js');draw();
</script></body></html>
