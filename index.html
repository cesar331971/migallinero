<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#a94224"><link rel="manifest" href="manifest.json"><title>Mi Gallinero</title><style>
:root{--r:#a94224;--bg:#fff8ef;--line:#e8ddd2;--ink:#2c2825;--mut:#716861}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px system-ui,Arial}main{max-width:950px;margin:auto;padding:20px}header{display:flex;justify-content:space-between;align-items:center}h1{margin:0;color:var(--r)}p{color:var(--mut)}nav{display:flex;gap:8px;margin:20px 0;overflow:auto}.tab,button{border:0;border-radius:9px;padding:10px 13px;font:inherit;font-weight:650;cursor:pointer}.tab{background:#f2e8df;color:#6b3a2c}.tab.on,button{background:var(--r);color:#fff}.view{display:none}.view.on{display:block}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.card,section{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin:14px 0}.card span{font-size:13px;color:var(--mut)}.card b{display:block;font-size:25px;margin-top:5px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}label{font-size:14px;font-weight:650}input,select,textarea{display:block;width:100%;padding:10px;margin-top:5px;border:1px solid #cfc4ba;border-radius:8px;font:inherit}textarea{min-height:70px}.row{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.small{font-size:13px;color:var(--mut)}.danger{background:#fff0ed;color:var(--r);margin-top:6px}.bar{height:24px;margin:8px 0;background:var(--r);border-radius:6px;color:#fff;padding:3px 8px;min-width:80px;font-size:13px}.filters{display:flex;gap:8px;align-items:end}.filters label{flex:1}@media(max-width:650px){main{padding:12px}.cards{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.filters{display:block}}</style></head><body><main><header><div><h1>🐔 Mi Gallinero</h1><p>Control de gastos y animales</p></div></header><nav><button class="tab on" data-v="inicio">Resumen</button><button class="tab" data-v="gastos">Gastos</button><button class="tab" data-v="gallinas">Gallinas</button></nav>
