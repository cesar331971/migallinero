<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#b42318">
  <meta name="description" content="Control de gastos e inventario del gallinero">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <title>Mi Gallinero</title>
  <style>
    :root{--red:#b42318;--red-dark:#8e1b12;--cream:#fff8ee;--ink:#28221e;--muted:#716862;--line:#eadfd4;--card:#fff;--green:#12715b}
    *{box-sizing:border-box} body{margin:0;background:var(--cream);color:var(--ink);font:16px system-ui,-apple-system,"Segoe UI",sans-serif}
    main{max-width:920px;margin:auto;padding:24px 16px 48px}.hero{display:flex;justify-content:space-between;gap:16px;align-items:center;margin:8px 0 24px}.brand{display:flex;gap:12px;align-items:center}.mark{font-size:32px;background:#ffe8c3;border-radius:16px;padding:8px 11px}.brand h1{font-size:25px;margin:0}.brand p{color:var(--muted);margin:2px 0 0;font-size:14px}
    button{font:inherit;border:0;border-radius:10px;cursor:pointer;font-weight:700}.install{background:#fff;color:var(--red);border:1px solid #e7c4bf;padding:10px 13px}.primary{width:100%;padding:13px;background:var(--red);color:white}.primary:hover{background:var(--red-dark)}
    .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}.card,.section{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 2px 8px #543b2410}.card{padding:16px}.card span{display:block;color:var(--muted);font-size:13px}.card strong{display:block;font-size:25px;margin-top:5px}.section{padding:20px;margin:18px 0}.section h2{font-size:18px;margin:0 0 16px}
    form,.fields{display:grid;gap:13px}.fields{grid-template-columns:1fr 1fr}label{font-weight:650;font-size:14px}input,select{margin-top:5px;width:100%;font:inherit;padding:11px;border-radius:9px;border:1px solid #cfc4b9;background:#fff}.food-details[hidden]{display:none}.food-details{background:#fff4e7;border-radius:10px;padding:12px}.actions{display:flex;gap:10px;align-items:center}.actions .primary{flex:1}.secondary{padding:12px;color:var(--red);background:#fff0ed}
    .chart{height:190px;display:flex;align-items:end;gap:10px;padding:16px 4px 0;border-bottom:1px solid var(--line);overflow-x:auto}.bar{height:100%;min-width:42px;display:flex;flex-direction:column;justify-content:end;align-items:center;gap:7px;font-size:11px;color:var(--muted)}.bar i{display:block;width:30px;min-height:3px;border-radius:7px 7px 0 0;background:var(--red)}.bar b{font-size:10px;white-space:nowrap;color:var(--ink)}.empty{color:var(--muted);align-self:center;margin:auto}
    .history-head{display:flex;justify-content:space-between;gap:8px;align-items:center}.history-head h2{margin:0}.records{margin:12px 0 0;padding:0;list-style:none}.record{display:grid;grid-template-columns:1fr auto;gap:10px;padding:14px 0;border-bottom:1px solid var(--line)}.record:last-child{border:0}.record p{margin:3px 0 0;color:var(--muted);font-size:13px}.record time{font-size:13px;color:var(--muted)}.record .amount{text-align:right;font-weight:800}.delete{margin-top:7px;background:transparent;color:var(--red);text-decoration:underline;font-size:13px;font-weight:600}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#28221e;color:#fff;padding:10px 14px;border-radius:9px;opacity:0;pointer-events:none;transition:opacity .2s}.toast.show{opacity:1}
    @media(max-width:570px){main{padding:13px 12px 36px}.hero{align-items:flex-start}.brand h1{font-size:22px}.install{font-size:13px}.cards{grid-template-columns:1fr 1fr}.card:last-child{grid-column:span 2}.section{padding:16px}.fields{grid-template-columns:1fr}.record{font-size:14px}}
  </style>
</head>
<body>
<main>
  <header class="hero"><div class="brand"><div class="mark">🐔</div><div><h1>Mi Gallinero</h1><p>Gastos e inventario, siempre a mano</p></div></div><button class="install" id="install" hidden>Instalar app</button></header>
  <section class="cards" aria-label="Resumen"><div class="card"><span>Gasto este mes</span><strong id="monthTotal">0,00 €</strong></div><div class="card"><span>Gasto acumulado</span><strong id="allTotal">0,00 €</strong></div><div class="card"><span>Pienso comprado</span><strong id="feedTotal">0 kg</strong></div></section>
  <section class="section"><h2>Registrar un gasto</h2><form id="expenseForm"><div class="fields"><label>Fecha<input id="date" type="date" required></label><label>Importe (€)<input id="amount" type="number" min="0.01" step="0.01" inputmode="decimal" placeholder="0,00" required></label></div><label>Categoría<select id="category" required><option value="Alimentación">Alimentación</option><option value="Salud">Medicinas y salud</option><option value="Mantenimiento">Mantenimiento</option><option value="Otros">Otros</option></select></label><div class="food-details" id="foodDetails"><div class="fields"><label>Tipo de pienso<input id="feedType" placeholder="Ej. Ponedoras"></label><label>Peso (kg)<input id="weight" type="number" min="0" step="0.1" inputmode="decimal" placeholder="0"></label></div></div><label>Notas (opcional)<input id="notes" maxlength="140" placeholder="Ej. Comprado en cooperativa"></label><button class="primary" type="submit">Guardar gasto</button></form></section>
  <section class="section"><h2>Gastos por mes</h2><div id="chart" class="chart" aria-label="Gráfica de gastos mensuales"></div></section>
  <section class="section"><div class="history-head"><h2>Historial</h2><button class="secondary" id="export">Exportar CSV</button></div><ul class="records" id="records"></ul></section>
</main><div class="toast" id="toast" role="status"></div>
<script>
  const KEY='gallinero.gastos.v2';
  let expenses=JSON.parse(localStorage.getItem(KEY)||'null');
  if(!Array.isArray(expenses)){try{expenses=JSON.parse(localStorage.getItem('gastosGallinero')||'[]')}catch{expenses=[]}}
  const $=id=>document.getElementById(id), eur=new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR'}), num=new Intl.NumberFormat('es-ES',{maximumFractionDigits:1});
  $('date').value=new Date().toISOString().slice(0,10);
  function persist(){localStorage.setItem(KEY,JSON.stringify(expenses))}
  function escapeText(v){return String(v||'')}
  function showToast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}
  function formatDate(date){return new Intl.DateTimeFormat('es-ES',{day:'2-digit',month:'short',year:'numeric'}).format(new Date(date+'T12:00:00'))}
  function render(){
    const now=new Date(), current=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');
    const total=expenses.reduce((s,e)=>s+Number(e.amount),0), month=expenses.filter(e=>e.date.startsWith(current)).reduce((s,e)=>s+Number(e.amount),0), feed=expenses.filter(e=>e.category==='Alimentación').reduce((s,e)=>s+Number(e.weight||0),0);
    $('monthTotal').textContent=eur.format(month);$('allTotal').textContent=eur.format(total);$('feedTotal').textContent=num.format(feed)+' kg';
    const records=$('records');records.replaceChildren();
    if(!expenses.length){const li=document.createElement('li');li.className='record';li.textContent='Aún no has registrado ningún gasto.';records.append(li)}
    [...expenses].sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id).forEach(e=>{const li=document.createElement('li');li.className='record';const left=document.createElement('div'),title=document.createElement('strong');title.textContent=e.category;const detail=document.createElement('p');detail.textContent=[e.category==='Alimentación'&&e.feedType, e.weight&&e.category==='Alimentación'?e.weight+' kg':'',e.notes].filter(Boolean).join(' · ')||'Sin notas';const time=document.createElement('time');time.textContent=formatDate(e.date);left.append(title,detail,time);const right=document.createElement('div');right.className='amount';right.textContent=eur.format(e.amount);const del=document.createElement('button');del.className='delete';del.textContent='Borrar';del.onclick=()=>{if(confirm('¿Borrar este gasto?')){expenses=expenses.filter(x=>x.id!==e.id);persist();render();showToast('Gasto borrado')}};right.append(del);li.append(left,right);records.append(li)});
    const grouped={};expenses.forEach(e=>{const key=e.date.slice(0,7);grouped[key]=(grouped[key]||0)+Number(e.amount)});const entries=Object.entries(grouped).sort(([a],[b])=>a.localeCompare(b)).slice(-12), chart=$('chart');chart.replaceChildren();if(!entries.length){const p=document.createElement('p');p.className='empty';p.textContent='Registra gastos para ver la evolución mensual.';chart.append(p);return}const max=Math.max(...entries.map(x=>x[1]));entries.forEach(([month,value])=>{const bar=document.createElement('div');bar.className='bar';bar.title=month+': '+eur.format(value);const val=document.createElement('b');val.textContent=eur.format(value);const fill=document.createElement('i');fill.style.height=Math.max(4,value/max*150)+'px';const label=document.createElement('span');label.textContent=month.slice(5)+'/'+month.slice(2,4);bar.append(val,fill,label);chart.append(bar)})
  }
  $('category').onchange=()=>$('foodDetails').hidden=$('category').value!=='Alimentación';
  $('expenseForm').onsubmit=e=>{e.preventDefault();const amount=Number($('amount').value);if(!Number.isFinite(amount)||amount<=0)return;expenses.push({id:Date.now(),date:$('date').value,amount,category:$('category').value,feedType:escapeText($('feedType').value).trim(),weight:Number($('weight').value)||0,notes:escapeText($('notes').value).trim()});persist();e.target.reset();$('date').value=new Date().toISOString().slice(0,10);$('foodDetails').hidden=false;render();showToast('Gasto guardado')};
  $('export').onclick=()=>{const header=['Fecha','Categoría','Tipo de pienso','Peso kg','Notas','Importe EUR'];const rows=expenses.map(e=>[e.date,e.category,e.feedType||'',e.weight||'',e.notes||'',Number(e.amount).toFixed(2)]);const csv=[header,...rows].map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(';')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='gastos-gallinero.csv';a.click();URL.revokeObjectURL(a.href)};
  let deferredPrompt;$('install').onclick=async()=>{if(deferredPrompt){deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;$('install').hidden=true}};window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;$('install').hidden=false});
  if('serviceWorker' in navigator)navigator.serviceWorker.register('service-worker.js');render();
</script></body></html>
